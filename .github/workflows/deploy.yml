name: Deploy Backend

on:
  push:
    branches:
      - main

env:
  PROJECT_ID: styleai-backend-501208
  REGION: asia-south1
  REPOSITORY: styleai
  IMAGE_NAME: backend
  SERVICE_NAME: styleai-backend-501208

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5


      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: "projects/668276293572/locations/global/workloadIdentityPools/github-pool/providers/github-provider"
          service_account: "github-actions-deployer@styleai-backend-501208.iam.gserviceaccount.com"


      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3


      - name: Configure Docker
        run: |
          gcloud auth configure-docker asia-south1-docker.pkg.dev --quiet


      - name: Build Docker Image
        run: |
          docker build \
          -t asia-south1-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/$IMAGE_NAME:${{ github.sha }} .


      - name: Push Docker Image
        run: |
          docker push \
          asia-south1-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/$IMAGE_NAME:${{ github.sha }}


      - name: Deploy Cloud Run
        run: |
          gcloud run deploy $SERVICE_NAME \
          --image asia-south1-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/$IMAGE_NAME:${{ github.sha }} \
          --region $REGION